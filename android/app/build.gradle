apply plugin: 'com.android.application'

android {
    // namespace = the Java/Kotlin package + R class root; it stays
    // `fm.goodtunes.player` so the existing source tree
    // (java/fm/goodtunes/player/*, MainActivity, plugins, FCM) and resources
    // don't have to move. It is INDEPENDENT of applicationId in Gradle.
    namespace "fm.goodtunes.player"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        // applicationId = the published, immutable Google Play package.
        // Deliberately kept as the legacy `com.gogoods_mobile` so this build
        // UPDATES the existing Play listing (preserving its installs + reviews)
        // instead of creating a new one. It intentionally differs from the code
        // `namespace` above and from the iOS bundle id (`Io.GoGoods.music`,
        // capacitor.config.ts + pbxproj) — Android/iOS ids need not match, and
        // `applicationId` may differ from `namespace`. Do NOT change this without
        // a full Play-listing migration. See docs/app-store-submission.md.
        applicationId "com.gogoods_mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "3.0.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Codemagic exposes the uploaded `goodtunes_keystore` reference through
        // these env vars (environment.android_signing in codemagic.yaml). Wiring
        // them here is REQUIRED: without a signingConfig, `gradlew bundleRelease`
        // emits an UNSIGNED .aab and Google Play rejects the upload with
        // "All uploaded bundles must be signed." Guarded on CM_KEYSTORE_PATH so
        // local/dev builds (var absent) behave exactly as before.
        release {
            def cmKeystorePath = System.getenv("CM_KEYSTORE_PATH")
            if (cmKeystorePath) {
                storeFile file(cmKeystorePath)
                storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                keyAlias System.getenv("CM_KEY_ALIAS")
                keyPassword System.getenv("CM_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            // Attach signing only when Codemagic supplied the keystore (CI).
            // Locally the release stays unsigned — unchanged from before.
            if (System.getenv("CM_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Android Auto media browser + session (Task #2504).
    implementation "androidx.media:media:$androidxMediaVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

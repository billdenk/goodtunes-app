# Codemagic cloud build pipeline for the GoodTunes Capacitor apps.
#
# Plain-English runbook (what each button does, Bill's one-time setup, the
# one-button App Store submit, and the manual-Mac fallback) lives in
# docs/codemagic-builds.md. Read that first if you're the operator.
#
# Three workflows:
#   ios-testflight      — day-to-day: build + sign + ship to TestFlight (auto build number).
#   ios-appstore-submit — the "push the button" workflow: build + ship + SUBMIT to Apple review.
#   android-internal    — AUTOMATIC (native-shell changes only): a push to `main` builds a signed .aab → Play internal testing.
#
# The two iOS workflows are MANUAL by design — they only run when started from
# the Codemagic UI/API, so nothing reaches Apple review without a deliberate
# click. android-internal AUTO-TRIGGERS on pushes to `main` BUT only actually
# builds when the merge changed the native shell (see the `when.changeset` block
# on that workflow) — web/server/content/docs merges reach devices via the live
# site on republish, so a fresh .aab is only needed when the shell changes. It
# uploads to the Play *internal testing* track only (low-stakes — never the public
# Play production track). Manual "Start new build" always runs (ignores `when`).
# For that webhook to fire, the Codemagic app must be connected to the GitHub
# build mirror repo (post-merge.sh force-pushes `main` there). See
# docs/google-play-setup.md.
#
# No secrets are hardcoded here. iOS signing uses an App Store Connect API key
# that Bill pastes into Codemagic once (referenced below as the
# `app_store_connect` integration named "GoodTunes ASC API key"). The numeric
# App Store "App Apple ID" and the Android signing/Play credentials are likewise
# supplied through Codemagic environment-variable groups, never committed.

definitions:
  # Reusable environment runtime block for the two iOS workflows.
  ios_env: &ios_env
    node: 20
    # PINNED to Codemagic's current default/stable toolchain, Xcode 26.4.1
    # (17E202), selected via the `26.4` selector (Codemagic exposes no finer
    # `26.4.1` string; `26.4` == `latest` == 26.4.1 today, and there is no higher
    # 26.4.x to drift to — 26.5/26.6/27 are `edge`, not stable). We are NOT on
    # `latest`/`edge`: those aliases roll silently.
    #
    # WHY WE MOVED FORWARD OFF 26.3: when Codemagic first rolled to 26.4.1 the
    # `Build the signed .ipa` step failed ("Failed to archive", exit 65) even
    # though NO app code changed, so #2551 pinned back to the last-known-good 26.3.
    # A failed 26.4.1 build's console (attached_assets/Pasted-Using-Xcode-26-4-1
    # -*.txt) finally root-caused it: the exit-65 is NOT a compiler break and NOT
    # the CarPlay grant — the archive fails with
    #   "App" requires a provisioning profile with the Associated Domains and
    #   Push Notifications features. Select a provisioning profile in the Signing
    #   & Capabilities editor.
    # That is the documented Xcode 26.2+ archive-time provisioning regression: the
    # newer toolchain's capability-resolution service fails to see that the
    # profile fetched by `fetch-signing-files` + applied by `use-profiles` already
    # carries the App ID's Associated Domains + Push capabilities. (It names only
    # those two, never carplay-audio, confirming this predates the CarPlay
    # entitlement and is a separate issue from the operator-blocked CarPlay grant.)
    # The `ENABLE_USER_SCRIPT_SANDBOXING = NO` setting is unrelated and was never
    # the fix. THE FIX is `-allowProvisioningUpdates` on the archive (see the
    # "Build the signed .ipa" step below), which lets xcodebuild re-resolve/refresh
    # the profile against Apple's backend (using the same ASC API key the build
    # already has) so the capability check passes.
    #
    # A SECOND, distinct archive break then surfaced under 26.4.1 once provisioning
    # was fixed: a build-graph cycle from output-less CocoaPods script phases
    # (Capacitor's `:disable_input_output_paths => true`), fixed in ios/App/Podfile
    # by flipping that flag to `false`. See the "Build the signed .ipa" step below
    # and docs/codemagic-builds.md.
    #
    # If a future Codemagic patch bumps the `26.4` selector to 26.4.2+ (drift the
    # memory warns about), re-confirm a green archive; on failure read the
    # `xcodebuild_logs` artifact. No deployment-target bump is needed: Xcode 26's
    # minimum is iOS 12 and we're at 13.0, and Capacitor's `assertDeploymentTarget`
    # post_install already stamps every pod target ≥13.0.
    #
    # `cocoapods: default` stays: Codemagic keeps each image's bundled CocoaPods in
    # lock-step with that image's Xcode, so `default` on the 26.4 image is the
    # SAFEST choice. Hard-pinning (e.g. 1.16.2) risks the open Xcode-26
    # `objectVersion 70` incompatibility — not a concern for us today (our
    # project.pbxproj is objectVersion 48), but a pin would freeze us on a version
    # that can't move forward with the image.
    xcode: 26.4
    cocoapods: default

  # Reusable build steps shared by both iOS workflows: web payload → Capacitor
  # sync → CocoaPods → managed signing → auto build number → signed .ipa.
  ios_build_scripts: &ios_build_scripts
    - name: Guard against firewall-poisoned lockfile URLs
      script: |
        # package-lock.json must only reference the public npm registry. Replit's
        # internal proxy (package-firewall.replit.local) only resolves inside
        # Replit's network, so if it ever leaks into the lockfile `npm ci` below
        # would die with ENOTFOUND deep into the build. Fail fast with a clear msg.
        if grep -q "package-firewall.replit.local" package-lock.json; then
          echo "ERROR: package-lock.json references package-firewall.replit.local (Replit-internal npm proxy)."
          echo "       Repoint those 'resolved' URLs to https://registry.npmjs.org/ and re-push the mirror."
          grep -n "package-firewall.replit.local" package-lock.json || true
          exit 1
        fi
        echo "lockfile registry check ok — no internal proxy URLs"
    - name: Install npm dependencies
      script: npm ci
    - name: Build the web payload (dist/public)
      script: npm run build
    - name: Sync Capacitor into the iOS project
      script: npx cap sync ios
    - name: Install CocoaPods dependencies
      script: |
        cd ios/App
        pod install
    - name: Set up iOS code signing (managed cert from our private key + fetch/create the profile)
      script: |
        # WHY THIS SHAPE: an App Store archive must be signed with a distribution
        # certificate's PRIVATE KEY. Hand-exporting a .p12 (cert + key) from macOS
        # Keychain Access and importing it on the cloud Mac proved unreliable — the
        # certificate loaded but its private key would not pair, so signing failed
        # with "Cannot save Signing Certificates without certificate private key"
        # (even after re-encoding the .p12 from legacy RC2/3DES to modern AES).
        #
        # Instead we let the App Store Connect API manage the certificate, but we
        # supply our OWN PERSISTENT private key so the SAME certificate is reused on
        # every build. CERTIFICATE_PRIVATE_KEY is a base64-encoded PEM RSA private
        # key stored as a SECURE env var in the `apple_app` group. See
        # docs/codemagic-builds.md → "Distribution certificate" for how to make it.
        #
        # `fetch-signing-files --create`:
        #   * if a distribution certificate matching this private key already exists
        #     in App Store Connect it is reused; otherwise a new one is created and
        #     signed with this key (so we always hold the matching private key);
        #   * the App Store provisioning profile is fetched or created. The profile
        #     inherits the App ID's capabilities, so Associated Domains + Push
        #     Notifications MUST be enabled on the `Io.GoGoods.music` identifier in
        #     the Apple Developer portal (one-time; see the runbook).
        # `keychain add-certificates` then loads the fetched cert+key into the
        # keychain and `use-profiles` points the Xcode project at the profile.
        keychain initialize
        echo "$CERTIFICATE_PRIVATE_KEY" | base64 --decode > /tmp/cert_key.pem
        echo "DIAG: private key file size = $(wc -c < /tmp/cert_key.pem) bytes"
        echo "DIAG: private key header = $(head -n 1 /tmp/cert_key.pem)"
        app-store-connect fetch-signing-files "Io.GoGoods.music" \
          --type IOS_APP_STORE \
          --certificate-key @file:/tmp/cert_key.pem \
          --create
        # The Notification Service Extension (rich push album art) is a SECOND
        # signed target with its own bundle id, so it needs its own App Store
        # provisioning profile. The NSE needs no special capabilities, so a
        # plain App ID + profile is enough; --create makes both if missing.
        app-store-connect fetch-signing-files "Io.GoGoods.music.NotificationService" \
          --type IOS_APP_STORE \
          --certificate-key @file:/tmp/cert_key.pem \
          --create
        rm -f /tmp/cert_key.pem
        keychain add-certificates
        xcode-project use-profiles
    - name: Set the marketing version and auto-increment the build number
      script: |
        cd ios/App
        # TWO different numbers, do not confuse them:
        #
        # 1) MARKETING VERSION (CFBundleShortVersionString) — the human-facing
        #    "3.0.1" customers see on the App Store. Apple REQUIRES every new
        #    build to carry a version HIGHER than the latest version already on
        #    the store, otherwise the upload is rejected (error 90062/90478).
        #    The iOS project shipped pinned at 1.0, which is below the live 3.0,
        #    so we stamp it here. *** BUMP THIS ONE LINE for each new release ***
        #    (e.g. 3.0.2, 3.1, 4.0). It must always exceed the current store
        #    version. The next step ("Guard — ...marketing version...") fails the
        #    build in seconds if you forget, instead of letting Apple reject the
        #    finished upload ten minutes later.
        MARKETING_VERSION=3.0.4
        agvtool new-marketing-version "$MARKETING_VERSION"
        #
        # 2) BUILD NUMBER (CFBundleVersion) — an internal counter that must be
        #    unique per upload. APP_STORE_APPLE_ID is the numeric App Apple ID
        #    from App Store Connect (App Information → General Information →
        #    Apple ID), set in the Codemagic "apple_app" variable group. We take
        #    whatever Apple already has and add 1, so duplicates are impossible
        #    even across machines. This is automatic — you never touch it.
        LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo "0")
        agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
    - name: Guard — fail fast if the marketing version is not above the live App Store version
      script: |
        # WHY THIS EXISTS: the marketing version (CFBundleShortVersionString) is
        # hand-stamped one step up. Apple REQUIRES every new upload to carry a
        # version STRICTLY HIGHER than the version currently live on the App Store
        # or it rejects the upload with error 90062/90478 — but only AFTER the
        # full ~10-minute Mac build + upload. If someone forgets to bump
        # MARKETING_VERSION, that whole build is wasted. This guard reads the
        # version actually stamped into the project and compares it to the live
        # store version up front, failing in seconds with a clear "bump
        # MARKETING_VERSION" message instead.
        #
        # It is FAIL-OPEN on uncertainty: on the very first submission (no live
        # version yet) or a transient API hiccup it warns and continues rather
        # than blocking a legitimate build. It only HARD-FAILS when it can prove
        # the stamped version is <= the live store version. See
        # scripts/verify-ios-marketing-version.py.
        STAMPED=$(cd ios/App && agvtool what-marketing-version -terse1 | head -n1)
        echo "Stamped marketing version: $STAMPED"
        # `apps app-store-versions list --app-store-state READY_FOR_SALE` returns
        # the version(s) currently live on the store as a JSON array; --json is
        # parsed by the python guard below. Fall back to an empty array (→
        # fail-open) if the API call errors so we never block on infra flakiness.
        app-store-connect apps app-store-versions list "$APP_STORE_APPLE_ID" \
          --platform IOS \
          --app-store-state READY_FOR_SALE \
          --json > /tmp/live_app_store_versions.json 2>/dev/null \
          || echo "[]" > /tmp/live_app_store_versions.json
        python3 scripts/verify-ios-marketing-version.py "$STAMPED" /tmp/live_app_store_versions.json
    - name: Guard — fail fast if TestFlight Test Information is incomplete
      script: |
        # WHY THIS EXISTS: every build on these workflows submits to TestFlight,
        # and App Store Connect rejects a TestFlight submission whose Beta App
        # Review Information (contact First/Last Name, Phone Number, Email) or
        # Beta App Information (Feedback Email) is incomplete. scripts/publish-ios.sh
        # already catches that deterministic failure — but only AFTER the full
        # ~10-25 minute Mac build + sign + upload. This up-front guard asks App
        # Store Connect whether that Test Information is complete BEFORE the build,
        # so a forgotten field fails in seconds with an actionable message + the
        # test-info URL instead of wasting the whole build.
        #
        # It is FAIL-OPEN on uncertainty (missing creds, no JWT lib, API/network
        # hiccup, unexpected response) — it warns and continues rather than
        # blocking a legitimate build, mirroring the marketing-version guard. It
        # only HARD-FAILS when App Store Connect proves a required field is empty.
        # PyJWT+cryptography sign the API request; if they aren't present the guard
        # simply fails open. See scripts/verify-ios-testflight-info.py.
        if [ "$PUBLISH_MODE" != "testflight" ] && [ "$PUBLISH_MODE" != "appstore" ]; then
          echo "PUBLISH_MODE='$PUBLISH_MODE' does not submit to TestFlight; skipping the Test Information guard."
        else
          pip3 install --quiet --disable-pip-version-check PyJWT cryptography || true
          python3 scripts/verify-ios-testflight-info.py
        fi
    - name: Guard — fail fast if the App Store listing metadata is incomplete
      script: |
        # WHY THIS EXISTS: PUBLISH_MODE=appstore doesn't just upload to TestFlight,
        # it also submits the version to PUBLIC App Store review. Apple rejects that
        # submission when the version's listing is incomplete — missing screenshots,
        # description, keywords, support URL, privacy-policy URL, or an unanswered
        # age-rating questionnaire — but, like the Test Information case, only AFTER
        # the full ~10-25 minute Mac build + sign + upload. This up-front guard asks
        # App Store Connect whether the in-prep version's listing is complete BEFORE
        # the build, so a forgotten field fails in seconds with an actionable message
        # + the distribution URL instead of wasting the whole build.
        #
        # appstore-mode ONLY: a plain TestFlight build never touches the public
        # listing, so this guard self-skips unless PUBLISH_MODE=appstore. It is
        # FAIL-OPEN on uncertainty (missing creds, no JWT lib, API/network hiccup,
        # unexpected response, or simply no version in a prepare-for-submission
        # state) — it warns and continues rather than blocking a legitimate build,
        # mirroring the marketing-version and Test Information guards. It only
        # HARD-FAILS when App Store Connect proves a required listing field is empty.
        # PyJWT+cryptography sign the API request; if they aren't present the guard
        # simply fails open. See scripts/verify-ios-appstore-listing.py.
        if [ "$PUBLISH_MODE" != "appstore" ]; then
          echo "PUBLISH_MODE='$PUBLISH_MODE' does not submit to App Store review; skipping the listing guard."
        else
          pip3 install --quiet --disable-pip-version-check PyJWT cryptography || true
          python3 scripts/verify-ios-appstore-listing.py
        fi
    - name: Guard — fail fast if the AppIcon set is invalid
      script: |
        # WHY THIS EXISTS: TestFlight Build 59 shipped Apple's GENERIC placeholder
        # icon (white tile, light-blue arrows) even though the committed asset
        # catalog was correct. Xcode NEVER fails an archive over a missing/invalid
        # app icon — it silently substitutes the placeholder. This guard converts
        # that silent fallback into a HARD, clearly-explained build failure so a
        # generic-icon build can never reach Apple again.
        #
        # It verifies, against the committed AppIcon.appiconset, that every
        # required slot is declared, every referenced PNG exists at the exact
        # pixel size its slot requires, and NO icon carries an alpha channel
        # (alpha is the classic cause of a dropped-to-placeholder icon). Image
        # inspection uses macOS `sips`, which is always present on the runner.
        python3 scripts/verify-ios-appicon.py
    - name: Gate CarPlay out of the distribution archive
      script: |
        # CarPlay (Task #2633) is real, wired native code: a
        # UIApplicationSceneManifest in Info.plist (phone window role + CarPlay
        # role, App.SceneDelegate + App.CarPlaySceneDelegate) and the
        # com.apple.developer.carplay-audio entitlement in App.entitlements.
        # Both are sensitive on a signed DISTRIBUTION build for two independent
        # reasons:
        #   1. carplay-audio is a RESTRICTED, request-only Apple entitlement — a
        #      distribution profile that doesn't carry it fails signing outright.
        #      See .agents/memory/carplay-restricted-entitlement.md.
        #   2. TWO prior real-device attempts at a scene manifest black-screened
        #      the store-signed binary. Even a manifest that declares both scene
        #      roles correctly (this one does) stays UNVERIFIED on a real device
        #      until a CarPlay Simulator / real-device pass has actually run.
        #      See .agents/memory/ios-scene-manifest-black-screen.md.
        #
        # So BY DEFAULT this step strips BOTH keys before the archive step,
        # reverting the build to the always-known-good, scene-manifest-free
        # legacy AppDelegate.window lifecycle. Dev/simulator builds never run
        # this workflow, so CarPlay stays fully testable there with both keys
        # committed in source. Set CARPLAY_GRANTED=true (also 1/yes/granted) in
        # Codemagic's `apple_app` group ONLY once Apple has granted the
        # entitlement on the App ID AND a CarPlay Simulator / real-device pass
        # has actually been recorded — see docs/native-builds.md.
        ENTITLEMENTS="ios/App/App/App.entitlements"
        INFO_PLIST="ios/App/App/Info.plist"
        GRANTED=$(echo "${CARPLAY_GRANTED:-false}" | tr '[:upper:]' '[:lower:]')

        if [ "$GRANTED" = "true" ] || [ "$GRANTED" = "1" ] || [ "$GRANTED" = "yes" ] || [ "$GRANTED" = "granted" ]; then
          echo "CARPLAY_GRANTED is set — keeping the carplay-audio entitlement and scene manifest in this distribution build."
        else
          echo "CARPLAY_GRANTED is not set — stripping the carplay-audio entitlement and scene manifest from this distribution build."
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.carplay-audio" "$ENTITLEMENTS" || true
          /usr/libexec/PlistBuddy -c "Delete :UIApplicationSceneManifest" "$INFO_PLIST" || true

          # Hard-fail rather than silently ship either key: an ungranted
          # entitlement fails signing anyway, but an unverified scene manifest
          # would sign FINE and black-screen on-device (the exact failure mode
          # documented in ios-scene-manifest-black-screen.md).
          if /usr/libexec/PlistBuddy -c "Print :com.apple.developer.carplay-audio" "$ENTITLEMENTS" >/dev/null 2>&1; then
            echo "ERROR: com.apple.developer.carplay-audio is still present in App.entitlements after the strip." >&2
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c "Print :UIApplicationSceneManifest" "$INFO_PLIST" >/dev/null 2>&1; then
            echo "ERROR: UIApplicationSceneManifest is still present in Info.plist after the strip." >&2
            exit 1
          fi
        fi
    - name: Build the signed .ipa
      script: |
        # `--archive-flags="-allowProvisioningUpdates"` is THE fix for the Xcode
        # 26.2+ archive break that #2551 papered over by pinning back to 26.3.
        # Under 26.4.1 the archive failed exit 65 with '"App" requires a
        # provisioning profile with the Associated Domains and Push Notifications
        # features' even though `fetch-signing-files`/`use-profiles` had already
        # installed a profile carrying exactly those capabilities — a known
        # regression where the newer toolchain's archive-time capability check
        # can't resolve the installed manual profile's entitlements. Passing
        # `-allowProvisioningUpdates` lets xcodebuild re-resolve/refresh the
        # profile against Apple's backend (it uses the SAME App Store Connect API
        # key the `app_store_connect` integration already exports as
        # APP_STORE_CONNECT_*), so the check passes. It is harmless on older
        # toolchains (no-op when the local profile already satisfies signing), so
        # it's safe to keep across Xcode bumps. Do NOT confuse it with the
        # unrelated `ENABLE_USER_SCRIPT_SANDBOXING = NO` setting, which never fixed
        # this. Verification is CI-only: re-run `ios-testflight`; on a fresh
        # failure read the `/tmp/xcodebuild_logs/*.log` artifact for the exact error.
        #
        # SECOND FAILURE (after the provisioning fix landed): build #42 on 26.4.1
        # got PAST the provisioning error but the archive still exit-65'd — this
        # time FAST (~13s, before any real compilation), with the only flagged
        # console line being the CocoaPods `[CP] Embed Pods Frameworks` phase
        # warning "will be run during every build because it does not specify any
        # outputs". A ~13s fail is a build-GRAPH (dependency cycle) rejection, not
        # a script-EXECUTION failure (which would fail minutes in, after compiling).
        # Root cause: Capacitor's Podfile set `install! 'cocoapods',
        # :disable_input_output_paths => true`, leaving that phase with no declared
        # outputs; 26.3 tolerated the resulting graph, 26.4.1's stricter build
        # system rejects it. FIX: flip that Podfile flag to `false` (ios/App/Podfile)
        # so CocoaPods emits proper input/output .xcfilelists. CONFIRMED green
        # (Jul 2026): archive succeeded and build 3.0.2 (72) uploaded to App Store
        # Connect. If a future archive exit-65s again, read the `xcodebuild_logs`
        # artifact for the exact line ("Cycle", "error:", or "PhaseScriptExecution
        # failed").
        xcode-project build-ipa \
          --workspace "ios/App/App.xcworkspace" \
          --scheme "App" \
          --archive-flags="-allowProvisioningUpdates"
    - name: Guard — fail fast if the BUILT .ipa ships Apple's placeholder icon
      script: |
        # WHY THIS EXISTS (and why it's separate from the source-icon guard above):
        # the source AppIcon.appiconset is correct, yet TestFlight builds 59/64/66
        # STILL shipped Apple's GENERIC placeholder. That means the archive compiled
        # WITHOUT baking the icon into the app bundle — a fault the source guard
        # cannot see. This guard inspects the actual produced .ipa: it unzips it,
        # runs `assetutil` on the compiled Assets.car, and confirms a real AppIcon
        # rendition (>=120px) is embedded (plus a best-effort near-white placeholder
        # check on any loose icon PNG). If no real icon is present it HARD-FAILS, so
        # a placeholder binary can never reach Apple again. Pillow is installed only
        # to enable the optional color check; the authoritative Assets.car check uses
        # macOS-native assetutil and needs no extra deps. See
        # scripts/verify-ios-ipa-icon.py.
        pip3 install --quiet --disable-pip-version-check Pillow || true
        python3 scripts/verify-ios-ipa-icon.py
    - name: Guard — fail fast if the BUILT .ipa has a blank (logo-free) splash screen
      script: |
        # WHY THIS EXISTS: around June 9 the three Splash.imageset PNGs were
        # overwritten with solid-navy (#00062B) images — no GoodTunes wordmark.
        # Xcode silently compiled the blank splash into the archive, the
        # LaunchScreen showed plain navy, and the @capacitor/splash-screen plugin
        # fell through to its own placeholder (the Android Bugdroid robot) visible
        # in TestFlight. Xcode never warns about this.
        #
        # This guard inspects the actual produced .ipa AFTER archiving:
        #   1. Unzips it and runs `assetutil --info` on Assets.car to confirm a
        #      Splash rendition is compiled in.
        #   2. Extracts the splash image from Assets.car (via `assetutil --output`)
        #      and pixel-samples the centre 100×100 px.
        #   3. Asserts that at least one centre pixel is NOT the navy background
        #      (#00062B ± 10 steps). A solid-navy centre means no wordmark was
        #      baked in, and we HARD-FAIL with a clear regeneration command.
        #
        # Source of truth: the splash PNGs are generated from
        # client/public/goodtunes-logo-white.png (the white GoodTunes wordmark)
        # composited onto a 2732×2732 navy canvas. See scripts/verify-ios-ipa-splash.py
        # and docs/native-builds.md (Splash screen section).
        pip3 install --quiet --disable-pip-version-check Pillow || true
        python3 scripts/verify-ios-ipa-splash.py
    - name: Publish to App Store Connect (tolerant of transient 500s)
      script: |
        # WHY THIS REPLACES THE DECLARATIVE `publishing:` BLOCK: App Store Connect
        # intermittently returns a 500 on the post-upload poll AFTER the binary has
        # already transferred. The declarative block treats that as fatal and wastes
        # the whole ~10-minute Mac build (build 65 died this way). This scripted
        # publish lets the CLI auto-retry transient 5xx, and on failure checks
        # whether the binary actually REGISTERED — retrying the upload only if it did
        # not (never re-uploading a registered binary), while failing fast on
        # DETERMINISTIC errors a retry can't fix (e.g. missing TestFlight Beta App
        # Review info). PUBLISH_MODE (set per workflow) selects testflight vs app
        # store; the submission flags inside mirror the old declarative blocks 1:1.
        # The `app_store_connect` integration on each workflow supplies the API-key
        # auth, exactly like the other scripted app-store-connect calls above. See
        # scripts/publish-ios.sh and docs/codemagic-builds.md.
        bash scripts/publish-ios.sh

  ios_artifacts: &ios_artifacts
    - build/ios/ipa/*.ipa
    - /tmp/xcodebuild_logs/*.log
    - ios/App/build/App.xcarchive

workflows:
  # ---------------------------------------------------------------------------
  # iOS → TestFlight (day-to-day). Builds, signs, uploads to TestFlight.
  # Does NOT submit to App Store review.
  # ---------------------------------------------------------------------------
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: GoodTunes ASC API key
    environment:
      <<: *ios_env
      groups:
        - apple_app # provides APP_STORE_APPLE_ID
      vars:
        # Selects the scripted publish behavior (scripts/publish-ios.sh):
        # "testflight" = upload + submit to TestFlight + add to the beta group.
        PUBLISH_MODE: testflight
    # NOTE: no declarative `ios_signing:` block on purpose — signing is done
    # manually in the "Set up iOS code signing" script above so we can pass
    # `--create` (the declarative block only fetches and fails when no profile
    # exists yet). The `app_store_connect` integration above still authorizes it.
    # triggering:                 # optional: auto-build on a pushed tag.
    #   events: [tag]             # e.g. `git tag testflight-1.4 && git push --tags`
    #   tag_patterns:
    #     - pattern: "testflight-*"
    #       include: true
    scripts: *ios_build_scripts
    artifacts: *ios_artifacts
    # NOTE: no declarative `publishing.app_store_connect:` block on purpose —
    # publishing is done by the scripted, transient-500-tolerant
    # "Publish to App Store Connect" step in the shared scripts above
    # (scripts/publish-ios.sh), driven by PUBLISH_MODE=testflight. That step
    # reproduces the old declarative behavior exactly: submit to TestFlight +
    # add the build to the "GoGoods Test Group" beta group.

  # ---------------------------------------------------------------------------
  # iOS → App Store review ("push the button"). Same build, but it also SUBMITS
  # the build for Apple review. This is the single deliberate trigger Bill
  # clicks when a build is ready to go to the public store.
  # ---------------------------------------------------------------------------
  ios-appstore-submit:
    name: iOS → App Store (submit for review)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: GoodTunes ASC API key
    environment:
      <<: *ios_env
      groups:
        - apple_app # provides APP_STORE_APPLE_ID
      vars:
        # Selects the scripted publish behavior (scripts/publish-ios.sh):
        # "appstore" = upload + submit to TestFlight + submit to App Store review
        # (AFTER_APPROVAL, phased release, cancel previous submissions).
        PUBLISH_MODE: appstore
    # NOTE: no declarative `ios_signing:` block on purpose — see the matching
    # note in the ios-testflight workflow. Signing runs in the shared script
    # with `--create`; the `app_store_connect` integration authorizes it.
    scripts: *ios_build_scripts
    artifacts: *ios_artifacts
    # NOTE: no declarative `publishing.app_store_connect:` block on purpose —
    # publishing is done by the scripted, transient-500-tolerant
    # "Publish to App Store Connect" step in the shared scripts above
    # (scripts/publish-ios.sh), driven by PUBLISH_MODE=appstore. That step
    # reproduces the old declarative behavior exactly: submit to TestFlight +
    # submit to App Store review with release_type AFTER_APPROVAL, phased
    # release, and cancel_previous_submissions (so a double-click doesn't error).

  # ---------------------------------------------------------------------------
  # Android → Play internal testing. AUTOMATIC, but only when the NATIVE SHELL
  # changed (the `when.changeset` filter below) — web/server/content/docs merges
  # reach devices via the live site on republish, so they skip the ~$0.50 no-op
  # build. When the shell changes it uploads a signed .aab to the Play *internal
  # testing* track (never the public production track). Credentials (`google_play`
  # service account + `goodtunes_keystore` upload key) are already set in Codemagic.
  # ---------------------------------------------------------------------------
  android-internal:
    name: Android → Play internal testing (auto on native-shell change)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      groups:
        - google_play # provides GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      android_signing:
        - goodtunes_keystore # keystore reference uploaded in Codemagic
      node: 20
    # AUTO-TRIGGER (CONDITIONAL — native shell only): every push to `main` (the
    # GitHub build mirror that post-merge.sh force-pushes to) reaches Codemagic,
    # but the build now RUNS only when the merge changed the native shell (see the
    # `when.changeset` block below). Requires the Codemagic app to be connected to
    # that repo so GitHub's webhook reaches Codemagic. cancel_previous_builds keeps
    # a burst of merges from stacking redundant builds.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    # WHY CONDITIONAL: the apps are thin Capacitor shells that load the live site
    # (server.url = https://my.goodtunes.music), so web/server/content/docs merges
    # reach iOS + Android the moment the web app is republished — no new .aab is
    # needed. A fresh Android build only matters when the NATIVE SHELL itself
    # changes. On the pay-as-you-go plan each no-op Linux build costs ~$0.50, so we
    # skip those. HOW IT STAYS SAFE under the force-pushed mirror: Codemagic
    # computes the changeset against the LAST SUCCESSFUL build's commit (not the
    # webhook's before-SHA), and project `main` is append-only, so the mirror's
    # defensive `git push --force HEAD:refs/heads/main` still presents a
    # fast-forward and the diff is clean. It fails OPEN (builds anyway) on the
    # first build after this lands and whenever the base commit is unreachable —
    # the intended bias (a wasted ~$0.50 beats shipping testers a stale shell).
    # Manual "Start new build" ALWAYS runs: when-conditions apply only to webhook
    # (automatic) builds. iOS workflows are untouched.
    when:
      changeset:
        includes:
          - 'android/'            # native project: Gradle/Kotlin, manifest, launcher + splash res, committed capacitor sync artifacts
          - 'capacitor.config.ts' # Capacitor config: server.url, registered plugins, native behavior
          - 'package.json'        # dependency set — catches an added/updated Capacitor plugin
          - 'package-lock.json'   # locked deps — a plugin add/bump always lands here
          # NOTE: `codemagic.yaml` is ALWAYS in the changeset by default (Codemagic
          # built-in), so changing this build config also forces a build.
    scripts:
      - name: Guard against firewall-poisoned lockfile URLs
        script: |
          # package-lock.json must only reference the public npm registry. Replit's
          # internal proxy (package-firewall.replit.local) only resolves inside
          # Replit's network, so if it ever leaks into the lockfile `npm ci` below
          # would die with ENOTFOUND deep into the build. Fail fast with a clear msg.
          if grep -q "package-firewall.replit.local" package-lock.json; then
            echo "ERROR: package-lock.json references package-firewall.replit.local (Replit-internal npm proxy)."
            echo "       Repoint those 'resolved' URLs to https://registry.npmjs.org/ and re-push the mirror."
            grep -n "package-firewall.replit.local" package-lock.json || true
            exit 1
          fi
          echo "lockfile registry check ok — no internal proxy URLs"
      - name: Install npm dependencies
        script: npm ci
      - name: Build the web payload (dist/public)
        script: npm run build
      - name: Sync Capacitor into the Android project
        script: npx cap sync android
      - name: Auto-increment versionCode from the latest Play build
        script: |
          # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS is the Play service-account JSON
          # (set in the google_play group). We upload into the EXISTING
          # com.gogoods_mobile listing, which already has published builds on the
          # PRODUCTION track (the ~100-install app) — almost certainly with a
          # higher versionCode than anything on the internal track. So query the
          # latest build number across ALL tracks (not just internal) and add 1.
          # Querying internal-only would fall back to 0 here → versionCode 1,
          # which Play rejects as already-used. More tracks can only RAISE the
          # floor, never lower it.
          LATEST_BUILD_NUMBER=$(google-play get-latest-build-number \
            --package-name "com.gogoods_mobile" \
            --tracks "internal" "alpha" "beta" "production" || echo "0")
          NEW_BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))
          # android/app/build.gradle hardcodes `versionCode 1`; patch it in
          # place for this build so the .aab carries the fresh number.
          sed -i.bak "s/versionCode .*/versionCode $NEW_BUILD_NUMBER/" \
            android/app/build.gradle
      - name: Guard — fail fast if the Android launcher/notification icons are invalid
        script: |
          # WHY THIS EXISTS: the iOS side already shipped a generic placeholder
          # icon to TestFlight (Build 59) because the build tooling silently
          # falls back to a default when the icon set is wrong. Android can fail
          # the SAME way — a missing launcher density ships a default/blank
          # launcher icon, and a notification small icon that isn't an alpha-only
          # white silhouette renders as a featureless gray box. This guard turns
          # those silent failures into a HARD, clearly-explained build failure.
          #
          # Android rules DIFFER from iOS: the launcher icon is an adaptive icon
          # (foreground/background layers + per-density mipmap rasters) and the
          # notification icon MUST be white-on-transparent (alpha-only) — the
          # OPPOSITE of the iOS no-alpha rule. The script encodes both. Pillow
          # gives a precise pixel check; we install it here so the white/alpha
          # inspection is deterministic on the Linux runner.
          pip3 install --quiet --disable-pip-version-check Pillow || true
          python3 scripts/verify-android-appicon.py
      - name: Build the signed .aab
        script: |
          cd android
          ./gradlew bundleRelease
      - name: Guard — fail fast if the BUILT .aab is not signed
        script: |
          # WHY THIS EXISTS: a `release` buildType with no signingConfig (or a
          # missing/renamed Codemagic keystore reference) makes `gradlew
          # bundleRelease` emit an UNSIGNED .aab with NO build-time error — it
          # only fails at the very LAST step, the Play upload ("All uploaded
          # bundles must be signed. Please sign the bundle using jarsigner."),
          # wasting the whole build. Catch it here with an actionable message.
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB" ]; then
            echo "ERROR: expected release bundle not found at $AAB"; exit 1
          fi
          if [ -z "${CM_KEYSTORE_PATH:-}" ]; then
            echo "ERROR: CM_KEYSTORE_PATH is empty — Codemagic did not supply the signing keystore."
            echo "       Check environment.android_signing (goodtunes_keystore) here AND that the"
            echo "       'goodtunes_keystore' reference is uploaded under Codemagic > Code signing identities."
            exit 1
          fi
          if command -v jarsigner >/dev/null 2>&1; then
            if ! jarsigner -verify "$AAB" >/tmp/jarsigner.log 2>&1; then
              echo "ERROR: the built .aab is NOT signed — Google Play will reject it."
              echo "       Verify android/app/build.gradle attaches signingConfigs.release to buildTypes.release."
              cat /tmp/jarsigner.log || true
              exit 1
            fi
            echo "aab signing check ok — bundle is signed"
          else
            echo "jarsigner not found — skipping binary signature verify (CM_KEYSTORE_PATH is present)"
          fi
      - name: Guard — fail fast if the BUILT .aab ships a wrong/blank launcher icon
        script: |
          # WHY THIS EXISTS (and why it's separate from the source-icon guard above):
          # the iOS side learned the hard way that a build can be "source-correct,
          # binary-wrong" — TestFlight builds 59/64/66 shipped Apple's GENERIC
          # placeholder even though the committed icons were fine, because the build
          # tooling dropped the icon when assembling the binary. The source guard
          # (verify-android-appicon.py) above validates the res/ tree and cannot see
          # that. This guard inspects the actual produced .aab: it unzips it, confirms
          # the adaptive-icon XML survived, that the per-density launcher rasters are
          # actually packaged at the right sizes, and (best-effort) that the navy
          # brand icon — not a near-white blank/default — is embedded. If no real
          # launcher icon is present it HARD-FAILS, so an icon-broken bundle can never
          # reach Google Play. Pillow gives a precise color check; we install it here
          # so the inspection is deterministic on the Linux runner (it also falls back
          # to ImageMagick / the raw PNG header). See scripts/verify-android-aab-icon.py.
          pip3 install --quiet --disable-pip-version-check Pillow || true
          python3 scripts/verify-android-aab-icon.py
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
    # NOTE: publishing is kept DECLARATIVE here on purpose — unlike iOS we do NOT
    # need a publish-ios.sh-style scripted retry. The Play Developer API is
    # transactional (insert edit → upload → assign track → COMMIT): a transient 5xx
    # before commit aborts the whole edit, so nothing partially registers and a
    # re-run cleanly re-does the upload (re-uploading the same versionCode in a
    # fresh edit is fine — the prior edit was discarded). That removes the entire
    # reason publish-ios.sh is complex (App Store Connect can REGISTER a binary and
    # then 500 the submission, forcing skip-upload/duplicate-binary handling — Play
    # has no such half-committed state). Google's publisher client also already
    # retries transient 5xx/429 with backoff, and codemagic-cli-tools' `google-play`
    # action group has no bundle-UPLOAD command to script around (only build-number /
    # track reads), so a scripted publish would mean re-implementing the upload
    # against the raw Play API — more risk than the rare transient failure justifies.
    # If transient publish failures ever become common, the path is fastlane
    # `supply` (pre-installed on the runner) with its own retry. See
    # docs/codemagic-builds.md → "Publishing reliability" and docs/google-play-setup.md.
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        # Submit straight to the internal testing track (testers, not public).
        submit_as_draft: false
        # WHY: Google's Play Developer API refuses to AUTO-submit a release for
        # review while the Console still has pending changes it can't review
        # programmatically — incomplete "App content" declarations (data safety,
        # content rating, target audience, ads, form factors, etc.) or an
        # app-level change awaiting manual review. In that state the COMMIT step
        # (after a successful .aab upload) hard-fails with:
        #   "Changes cannot be sent for review automatically. Please set the query
        #    parameter changesNotSentForReview to true. Once committed, the changes
        #    in this edit can be sent for review from the Google Play Console UI."
        # So the build succeeds, the bundle uploads, and then the whole publish
        # fails at the last step. Setting this true commits the edit WITHOUT
        # auto-submitting: the release is created on the internal track and then an
        # operator clicks "Send N changes for review" in the Play Console once any
        # outstanding declarations are complete. This is the same fix fastlane
        # `supply` exposes as `changes_not_sent_for_review`. See
        # docs/google-play-setup.md → "Sending a release for review".
        changes_not_sent_for_review: true
